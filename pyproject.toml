[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dpi-engine"
dynamic = ["version"]
description = "Offline deep packet inspection of PCAP captures: flow classification, blocking rules, filtered output, JSON/HTML reports"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Rekh-225" }]
keywords = ["pcap", "dpi", "packet-inspection", "network", "sni", "dns", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
]
# Standard library only.
dependencies = []

[project.scripts]
dpi-engine = "dpi.cli:main"

[project.urls]
Homepage = "https://github.com/Rekh-225/Deep-Packet-Inspection-System"

[tool.setuptools]
packages = ["dpi"]

[tool.setuptools.dynamic]
version = { attr = "dpi.__version__" }
